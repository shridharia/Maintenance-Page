<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>We'll Be Back Shortly</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #1c1b1b;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }

    .box {
      max-width: 600px;
    }

    h1 {
      color: #264cd7;
      margin-bottom: 12px;

      font-size: 18px;

  <div class="box">
    <h1>We’re temporarily unavailable</h1>
    <p>
      Our website is experiencing a temporary issue.
      Our team is already working on it.
    </p>

    <p>
      Please check back in a few minutes.
    </p>
  </div>
</body>
</html>
